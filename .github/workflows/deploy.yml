name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy-web:
    name: Build & deploy web app (Cloudflare Workers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - run: bun run build:web
        env:
          # Publishable/anon-style values — safe to be public, they end up
          # inlined in the client bundle regardless of where they're set.
          VITE_SUPABASE_URL: "https://zerepuiyqbenogeyllxb.supabase.co"
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          # Server-side (SSR) reads of the same values, via process.env.
          SUPABASE_URL: "https://zerepuiyqbenogeyllxb.supabase.co"
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: ".output/server"
          packageManager: bun
          command: deploy
          secrets: |
            SUPABASE_SERVICE_ROLE_KEY
        env:
          # A etapa de "wrangler secret bulk" (upload de secrets) roda como
          # um subprocesso separado que não herda o apiToken passado só via
          # `with:` — precisa também estar no ambiente explicitamente.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

  publish-mobile-ota:
    name: Publish mobile OTA bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - run: bun run build:mobile

      - name: Package and publish OTA bundle
        env:
          SUPABASE_URL: "https://zerepuiyqbenogeyllxb.supabase.co"
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          cd mobile/dist
          zip -qr ../../dist.zip .
          cd ../..
          CHECKSUM=$(sha256sum dist.zip | cut -d ' ' -f1)
          VERSION="${GITHUB_SHA:0:7}"

          # -w aponta o status HTTP no fim do corpo; sem -f, então dá pra
          # imprimir a resposta de verdade quando algo falhar em vez de só
          # "exit code 22". x-upsert deixa reenviar o mesmo build_number
          # (ex: ao clicar "Re-run") sem travar em cima de um arquivo que já
          # existe de uma tentativa anterior.
          UPLOAD_RESPONSE=$(curl -s -w '\n%{http_code}' -X POST \
            "$SUPABASE_URL/storage/v1/object/web-releases/${BUILD_NUMBER}.zip" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/zip" \
            -H "x-upsert: true" \
            --data-binary @dist.zip)
          UPLOAD_STATUS=$(echo "$UPLOAD_RESPONSE" | tail -n1)
          UPLOAD_BODY=$(echo "$UPLOAD_RESPONSE" | sed '$d')
          echo "Storage upload status: $UPLOAD_STATUS"
          if [ "$UPLOAD_STATUS" -ge 300 ]; then
            echo "::error::Falha ao subir o bundle pro Storage: $UPLOAD_BODY"
            exit 1
          fi

          PUBLIC_URL="$SUPABASE_URL/storage/v1/object/public/web-releases/${BUILD_NUMBER}.zip"
          INSERT_RESPONSE=$(curl -s -w '\n%{http_code}' -X POST \
            "$SUPABASE_URL/rest/v1/web_releases?on_conflict=build_number" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: resolution=merge-duplicates,return=minimal" \
            -d "{\"build_number\": ${BUILD_NUMBER}, \"version\": \"${VERSION}\", \"url\": \"${PUBLIC_URL}\", \"checksum\": \"${CHECKSUM}\"}")
          INSERT_STATUS=$(echo "$INSERT_RESPONSE" | tail -n1)
          INSERT_BODY=$(echo "$INSERT_RESPONSE" | sed '$d')
          echo "Release row insert status: $INSERT_STATUS"
          if [ "$INSERT_STATUS" -ge 300 ]; then
            echo "::error::Falha ao registrar a release na tabela web_releases: $INSERT_BODY"
            exit 1
          fi

  deploy-supabase-functions:
    name: Deploy Supabase Edge Functions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - run: supabase functions deploy --project-ref zerepuiyqbenogeyllxb
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
